name: Android E2E Appium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: macos-13
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r appium_tests/requirements.txt

      - name: Reconstruct google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Warning: GOOGLE_SERVICES_JSON secret is not set!"
          else
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run E2E Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Check if Appium is already running on port 4723
            if python -c "import socket; s = socket.socket(); s.settimeout(1); exit(0 if s.connect_ex(('127.0.0.1', 4723)) == 0 else 1)"; then
              echo "Appium server is already running on port 4723."
            else
              echo "Appium server is not running. Starting Appium..."
              appium &
              # Wait up to 30 seconds for Appium to start
              for i in {1..15}; do
                if python -c "import socket; s = socket.socket(); s.settimeout(1); exit(0 if s.connect_ex(('127.0.0.1', 4723)) == 0 else 1)"; then
                  echo "Appium server started successfully."
                  break
                fi
                sleep 2
              done
            fi
            
            # Execute only the existing Python test command
            python appium_tests/run_all_tests.py

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medmonitor-test-reports
          path: appium_tests/reports/
