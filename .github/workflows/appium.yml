name: Android E2E Appium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and Drivers
        run: |
          npm install -g appium
          appium driver list --installed

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r appium_tests/requirements.txt

      - name: Reconstruct google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if ($env:GOOGLE_SERVICES_JSON) {
            $env:GOOGLE_SERVICES_JSON | Out-File -FilePath app/google-services.json -Encoding utf8
          } else {
            Write-Output "Warning: GOOGLE_SERVICES_JSON secret is not set!"
          }

      - name: Build Debug APK
        run: |
          .\gradlew assembleDebug

      - name: Run E2E Appium Tests
        run: |
          # Check if Appium is already running on port 4723
          python -c "import socket; s = socket.socket(); s.settimeout(1); exit(0 if s.connect_ex(('127.0.0.1', 4723)) == 0 else 1)"
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Appium server is already running on port 4723."
          } else {
            Write-Output "Appium server is not running. Starting Appium..."
            Start-Process appium -NoNewWindow
            # Wait up to 30 seconds for Appium to start
            for ($i=1; $i -le 15; $i++) {
              Start-Sleep -Seconds 2
              python -c "import socket; s = socket.socket(); s.settimeout(1); exit(0 if s.connect_ex(('127.0.0.1', 4723)) == 0 else 1)"
              if ($LASTEXITCODE -eq 0) {
                Write-Output "Appium server started successfully."
                break
              }
            }
          }

          # Execute only the existing Python test command
          python appium_tests/run_all_tests.py

      # ---------------------------------------------------------------
      # Publish Test Report to GitHub Pages (docs/reports/)
      # This replaces the old artifact upload so the report is a
      # live webpage, not a downloadable zip file.
      # ---------------------------------------------------------------
      - name: Publish HTML Report to GitHub Pages
        if: always()
        shell: powershell
        run: |
          # Ensure the docs/reports and docs/downloads directories exist
          New-Item -ItemType Directory -Force -Path "docs/reports" | Out-Null
          New-Item -ItemType Directory -Force -Path "docs/downloads" | Out-Null

          # Copy the newly generated HTML report (if it exists) into docs/reports/
          $generatedReport = "appium_tests/reports/Test_Report.html"
          $destinationReport = "docs/reports/Test_Report.html"

          if (Test-Path $generatedReport) {
            Write-Output "Copying fresh HTML report from appium_tests/reports/ to docs/reports/ ..."
            Copy-Item -Path $generatedReport -Destination $destinationReport -Force
          } else {
            Write-Output "No fresh report generated. The existing docs/reports/Test_Report.html will be re-published."
          }

          # Copy the newly generated Excel report (if it exists) into docs/reports/
          $generatedExcel = "appium_tests/reports/MedMonitor_Automation_Report.xlsx"
          $destinationExcel = "docs/reports/MedMonitor_Test_Report.xlsx"

          if (Test-Path $generatedExcel) {
            Write-Output "Copying fresh Excel report from appium_tests/reports/ to docs/reports/ ..."
            Copy-Item -Path $generatedExcel -Destination $destinationExcel -Force
          } else {
            Write-Output "No fresh Excel report generated."
          }

          # Copy the newly built APK (if it exists) into docs/downloads/
          $generatedApk = "app/build/outputs/apk/debug/app-debug.apk"
          $destinationApk = "docs/downloads/MedMonitorAI.apk"

          if (Test-Path $generatedApk) {
            Write-Output "Copying fresh APK build from app/build/outputs/apk/debug/ to docs/downloads/ ..."
            Copy-Item -Path $generatedApk -Destination $destinationApk -Force
          } else {
            Write-Output "No fresh APK build generated."
          }

          # Configure git identity for the commit
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage and commit report files and APK
          git add docs/reports/Test_Report.html docs/reports/MedMonitor_Test_Report.xlsx docs/downloads/MedMonitorAI.apk
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "ci: update test report and build artifacts [skip ci]"
            git push origin HEAD:main
            Write-Output "Test report and build artifacts committed and pushed to docs/."
          } else {
            Write-Output "Artifacts unchanged — nothing to commit."
          }

      # ---------------------------------------------------------------
      # Add a clickable link to the report in the Actions Summary page
      # ---------------------------------------------------------------
      - name: Post Report Link to Job Summary
        if: always()
        shell: powershell
        run: |
          $reportUrl = "https://srikeshk.github.io/MedMonitor-AI-Android/reports/Test_Report.html"
          $mainUrl    = "https://srikeshk.github.io/MedMonitor-AI-Android/"

          $summary = @"
          ## 🧪 MedMonitor AI — Test Report

          | Resource | Link |
          |----------|------|
          | 📊 **Live Test Report** | [$reportUrl]($reportUrl) |
          | 🌐 **Project Website**  | [$mainUrl]($mainUrl) |

          > _Report is published via GitHub Pages. Click the link above to view the full interactive HTML dashboard._
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
